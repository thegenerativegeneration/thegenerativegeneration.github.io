name: Check for broken links on site

on:
  workflow_run:
    workflows: [Deploy site]
    types: [completed]
  workflow_dispatch:

jobs:
  check-links-on-site:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Setup Ruby (version from .ruby-version)
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
      - name: Install ImageMagick
        run: sudo apt-get update && sudo apt-get install -y imagemagick
      - name: Build
        run: JEKYLL_ENV=production bundle exec jekyll build
      # Internal links are already checked by html-proofer in the deploy workflow;
      # this job checks the outbound ones (press, papers, venues). News sites often
      # answer bots with 403/429, which is not a broken link.
      - name: Link Checker
        uses: lycheeverse/lychee-action@v2
        with:
          fail: true
          args: >-
            --no-progress --max-retries 2 --accept 200,206,403,429
            --exclude-path _site/assets
            '_site/**/*.html'
