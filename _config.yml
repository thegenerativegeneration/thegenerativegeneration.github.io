# Site
title: Philipp Haslbauer
first_name: Philipp
last_name: Haslbauer
description: >
  Software developer, researcher, and artist based in Lucerne, Switzerland.
keywords: portfolio, interactive media, artificial intelligence, gaussian splatting
lang: en
icon: favicon.ico # in /assets/img/
url: https://philipphaslbauer.com
baseurl:

google_site_verification: JXSZt1SMxUkVgA2tWsJ71GeJ4utjZN3duCWYhUwG_dk
enable_google_verification: true

# Blog
blog_description: Thoughts, art, and AI.
permalink: /blog/:year/:title/
pagination:
  enabled: true
external_sources:
  - name: Substack
    rss_url: https://philipphaslbauer.substack.com/feed

# Collections
collections:
  projects:
    output: true
    permalink: /works/:name/
  experiments:
    output: true
experiments_exclude: [mhg-scriptorium] # folders in _experiments_src/public not shown on the site

# Publications (jekyll-scholar)
scholar:
  last_name: [Haslbauer, H.]
  first_name: [Philipp, P.]
  style: apa
  locale: en
  source: /_bibliography/
  bibliography: papers.bib
  bibliography_template: bib
  bibtex_filters: [latex, smallcaps, superscript]
  replace_strings: true
  join_strings: true
  details_dir: bibliography
  details_link: Details
  query: "@*"
  group_by: year
  group_order: descending
filtered_bibtex_keywords:
  [abbr, abstract, additional_info, annotation, arxiv, award, award_name, bibtex_show, blog, code,
   featured, featured_description, featured_order, featured_title, html, pdf, poster, preview,
   selected, slides, supp, video, website]
max_author_limit: 3
more_authors_animation_delay: 10
enable_publication_thumbnails: true
bib_search: true

# Build
markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM
  syntax_highlighter_opts:
    css_class: "highlight"
    span:
      line_numbers: false
    block:
      line_numbers: false
include: ["_pages"]
exclude:
  - bin/
  - docs/
  - test/
  - Gemfile
  - Gemfile.lock
  - LICENSE
  - purgecss.config.js
  - README.md
  - vendor
  - .superpowers/
  - .playwright-mcp/
keep_files:
  - CNAME
  - .nojekyll

plugins:
  - jekyll-email-protect
  - jekyll-feed
  - jekyll-imagemagick
  - jekyll-link-attributes
  - jekyll-paginate-v2
  - jekyll-regex-replace
  - jekyll/scholar
  - jekyll-sitemap
  - jekyll-toc

defaults:
  - scope:
      path: "assets"
    values:
      sitemap: false

sass:
  style: compressed

external_links:
  enabled: true
  rel: external nofollow noopener
  target: _blank
  exclude:

jekyll-minifier:
  compress_javascript: false
  exclude:
    - robots.txt
    - assets/demos/**/*.js
    - assets/demos

terser:
  compress:
    drop_console: true

imagemagick:
  enabled: true
  widths: [480, 800, 1400]
  input_directories:
    - assets/img/
  input_formats: [".jpg", ".jpeg", ".png", ".tiff", ".gif"]
  output_formats:
    webp: "-quality 85"
lazy_loading_images: true
